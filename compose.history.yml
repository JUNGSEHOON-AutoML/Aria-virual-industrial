# Independent, opt-in local history service. No dependency on existing GPU compose.
services:
  history-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: ${ARIA_LOCAL_DB_PASSWORD:?Set a local development password}
      POSTGRES_DB: aria
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aria-history-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria -d aria"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aria-history-postgres:
